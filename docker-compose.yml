version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: devpulse_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: github_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d github_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Redis Cache & Job Queue
  redis:
    image: redis:7-alpine
    container_name: devpulse_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 3. FastAPI AI Microservice
  fastapi-ai-services:
    build:
      context: ./FastAPI-AI-Services
      dockerfile: Dockerfile
    container_name: devpulse_fastapi_ai
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres:5432/github_monitoring
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 4. Express Node.js Backend API
  backend:
    build:
      context: ./GitHub-Backend
      dockerfile: Dockerfile
    container_name: devpulse_backend
    environment:
      - PORT=5001
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres:5432/github_monitoring
      - REDIS_URL=redis://redis:6379
      - FASTAPI_AI_SERVICE_URL=http://fastapi-ai-services:8000
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_devpulse}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_PRIVATE_KEY=${GITHUB_PRIVATE_KEY:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fastapi-ai-services:
        condition: service_started
    restart: unless-stopped

  # 5. Next.js Frontend Web Application
  frontend:
    build:
      context: ./GitHub-Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5001/api
        NEXT_PUBLIC_AI_SERVICE_URL: http://localhost:8000
    container_name: devpulse_frontend
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:5001/api
      - NEXT_PUBLIC_AI_SERVICE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
